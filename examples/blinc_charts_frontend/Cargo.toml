[package]
name = "blinc_charts_frontend"
description = "Blinc web/WASM gallery for blinc_charts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--all-features']

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
anyhow = "1.0"
blinc_charts = { path = "../.." }
blinc_core = { git = "https://github.com/mrchypark/Blinc.git", rev = "b9b0c2b01b15cfeaed1de5820e21c76823402fda", package = "blinc_core" }
blinc_layout = { git = "https://github.com/mrchypark/Blinc.git", rev = "b9b0c2b01b15cfeaed1de5820e21c76823402fda", package = "blinc_layout" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
blinc_app = { git = "https://github.com/mrchypark/Blinc.git", rev = "b9b0c2b01b15cfeaed1de5820e21c76823402fda", package = "blinc_app", default-features = false, features = ["web"] }
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
